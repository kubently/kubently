# Kubently Helm Chart Values

# API Configuration (includes A2A server)
api:
  # Core component — set to false only for executor-only deployments on remote clusters
  enabled: true

  replicaCount: 3  # Can scale horizontally with connection registry
  
  image:
    repository: ghcr.io/kubently/kubently
    pullPolicy: IfNotPresent
    tag: "latest"
  
  service:
    type: ClusterIP
    port: 8080      # Changed from 5000 to match container port
    targetPort: 8080
  
  resources:
    requests:
      cpu: 250m  # Slightly increased for A2A
      memory: 384Mi  # Increased to handle both servers
    limits:
      cpu: 1000m
      memory: 768Mi
  
  # API Keys for authentication
  # OPTION 1 (RECOMMENDED): Use existing secret (managed separately)
  # Set existingSecret to the name of your manually created secret
  # The secret must contain a 'keys' field with newline-separated API keys
  # Example:
  #   kubectl create secret generic my-api-keys \
  #     --from-literal=keys="$(cat <<EOF
  #   key1
  #   key2
  #   EOF
  #   )"
  existingSecret: ""  # e.g., "kubently-api-keys"

  # OPTION 2: Provide keys directly in values (NOT recommended for production)
  # Only used if existingSecret is not set
  # Format: each key on a new line (just the key value, no "service:" prefix needed)
  # Example: apiKeys: ["abc123...", "def456..."]
  apiKeys: []
  
  # Slack incoming-webhook URL — enables both proactive paths:
  # /webhooks/alertmanager -> Slack diagnosis, and the fleetReport digest below.
  #
  # The URL is a credential: anyone holding it can post to your channel, so
  # create a secret rather than putting it in a values file.
  #   kubectl create secret generic kubently-slack \
  #     --from-literal=url='https://hooks.slack.com/services/...' -n kubently
  slackWebhook:
    existingSecret: ""   # e.g. "kubently-slack" (takes precedence over api.env)
    secretKey: "url"

  env:
    LOG_LEVEL: "INFO"
    MAX_COMMANDS_PER_FETCH: "10"
    COMMAND_TIMEOUT: "30"
    SESSION_TTL: "300"
    PORT: "8080"
    API_PORT: "8080"

# ============================================================================
# Scheduled Fleet Health Digest
# ============================================================================
# A CronJob POSTs /webhooks/fleet-report on a schedule; the agent sweeps every
# registered cluster and posts one digest to SLACK_WEBHOOK_URL (set above).
#
# Try it before you schedule it — neither needs a helm upgrade:
#   # preview the digest, post nothing:
#   curl -X POST $API/webhooks/fleet-report -H "X-API-Key: $KEY" \
#     -H 'Content-Type: application/json' -d '{"dry_run": true}'
#   # run the real scheduled path once:
#   kubectl create job --from=cronjob/kubently-fleet-report fleet-report-test -n kubently
fleetReport:
  enabled: false
  # Create the CronJob but never fire it on schedule (manual triggering only).
  suspend: false
  # Weekday mornings. Interpreted in the cluster's timezone (UTC by default).
  schedule: "0 13 * * 1-5"
  # Override the digest query. Empty = the shipped prompts/fleet_report.prompt.yaml.
  # Per-call overrides for iterating: POST {"query": "...", "dry_run": true}.
  # Example:
  #   query: |-
  #     Check every cluster for pods restarting more than 5 times and for PVCs
  #     above 85% usage. One line per healthy cluster. No preamble.
  query: ""

# ============================================================================
# Deployment Verification (proactive)
# ============================================================================
# POST /webhooks/verify-deployment after a deploy (from CI, ArgoCD hooks, or
# curl) and the agent watches the rollout settle, then investigates the result
# — pods, events, error logs, and metrics vs the pre-deploy window where
# Prometheus is configured — and posts a PASS/FAIL verdict with evidence to the
# Slack webhook (api.slackWebhook above). Verifications always post.
#
#   curl -X POST $API/webhooks/verify-deployment -H "X-API-Key: $KEY" \
#     -H 'Content-Type: application/json' \
#     -d '{"cluster": "prod-east", "namespace": "shop", "workload": "deploy/checkout-api"}'
#
# Preview without posting: add "dry_run": true (runs synchronously).
verifyDeployment:
  # Optional deploy watch: the API sweeps registered clusters for workloads
  # labelled `kubently.io/verify=enabled` and fires a verification whenever a
  # workload's .metadata.generation changes (i.e. someone deployed). No CI
  # integration needed — label the workload and every deploy gets verified.
  watch:
    enabled: false
    # How often to sweep, in seconds (min 15).
    intervalSeconds: 60
    # Restrict the sweep to specific cluster ids. Empty = all registered.
    clusters: []
  # Default settle deadline (seconds) when the trigger doesn't send
  # timeout_seconds. Clamped per-request to [60, 1800].
  timeoutSeconds: 600

# ============================================================================
# Scheduled Checks (proactive)
# ============================================================================
# Named, cron-scheduled agent investigations. Each check gets its own CronJob
# that POSTs /webhooks/scheduled-check; the agent runs the check's prompt and
# posts the result to the Slack webhook (api.slackWebhook above).
#
# Noise discipline: a PASSing check posts nothing unless notifyOnPass is true
# (globally or per check). A FAIL — or an answer whose verdict can't be parsed
# — always posts, with the evidence trail.
#
# Iterate on a check without waiting for cron (runs synchronously, posts
# nothing):
#   curl -X POST $API/webhooks/scheduled-check -H "X-API-Key: $KEY" \
#     -H 'Content-Type: application/json' \
#     -d '{"check": "cert-expiry", "dry_run": true}'
# Or run the real scheduled path once:
#   kubectl create job --from=cronjob/kubently-check-cert-expiry check-test -n kubently
scheduledChecks:
  enabled: false
  # Global default; each check may override with its own notifyOnPass.
  notifyOnPass: false
  # Each check: name (lowercase-hyphen, max 30 chars — becomes the CronJob
  # name), schedule (5-field cron, cluster timezone), prompt (the question the
  # agent investigates), and optionally clusters (empty = all registered),
  # notifyOnPass, suspend.
  checks: []
  # Example:
  #   checks:
  #     - name: cert-expiry
  #       schedule: "0 8 * * 1"
  #       clusters: [prod-east, prod-west]
  #       prompt: |-
  #         Check TLS secrets for certificates expiring within 21 days.
  #         List each as namespace/name with days remaining.
  #     - name: pvc-pressure
  #       schedule: "0 */6 * * *"
  #       notifyOnPass: true
  #       prompt: |-
  #         Find PersistentVolumeClaims above 85% usage and nodes under
  #         disk pressure.

# ============================================================================
# Loki Log Search (optional)
# ============================================================================
# Gives the diagnostic agent a read-only LogQL tool (query_loki) for searching
# aggregated logs — including logs from pods that have restarted, been
# rescheduled or deleted, which plain kubectl-based search cannot reach.
#
# The URL must be reachable FROM THE EXECUTOR POD — queries are executed by the
# executor inside the monitored cluster (same outbound channel as kubectl
# commands), never by the central API. Example for the loki-stack chart:
#   url: "http://loki.monitoring.svc.cluster.local:3100"
#
# Leave empty (default) to disable: the agent does not register the tool, the
# system prompt never mentions Loki, and the executor rejects Loki queries
# with a clear "not configured" error. The selector-based search_pod_logs
# tool is always available and needs no configuration.
#
# Split deployments (central API + remote executors): set loki.url on BOTH
# installs. On an executor install it is the URL the executor queries; on the
# API install it only enables the tool (the control plane never dials it).
loki:
  url: ""
  # Optional X-Scope-OrgID header for multi-tenant Loki (executor-side only).
  tenantId: ""

# ============================================================================
# Prometheus Metrics Tool (optional)
# ============================================================================
# Gives the diagnostic agent a read-only PromQL tool (query_prometheus) for
# latency, saturation, OOM-trend and restart-over-time questions.
#
# The URL must be reachable FROM THE EXECUTOR POD — queries are executed by the
# executor inside the monitored cluster (same outbound channel as kubectl
# commands), never by the central API. Example for kube-prometheus-stack:
#   url: "http://prometheus-operated.monitoring.svc.cluster.local:9090"
#
# Leave empty (default) to disable: the agent does not register the tool, the
# system prompt never mentions metrics, and the executor rejects metric
# queries with a clear "not configured" error.
#
# Split deployments (central API + remote executors): set prometheus.url on
# BOTH installs. On an executor install it is the URL the executor queries; on
# the API install it only enables the tool (the control plane never dials it).
prometheus:
  url: ""
# Change Correlation Sources (optional)
# ============================================================================
# The agent's get_recent_changes tool builds a "what changed?" timeline from
# rollout history, ReplicaSet revisions and events — always available through
# the executor's read-only kubectl surface. The two sources below are
# additional and opt-in.
changeCorrelation:
  # Helm release history (`helm history` / `helm list`, read-only, executed by
  # the executor). Opt-in because Helm 3 stores release records in Secrets, so
  # enabling this grants the executor RBAC to get/list Secrets cluster-wide.
  # The kubectl command whitelist still blocks `kubectl get secrets` — only
  # helm's own history/list output (revisions, charts, dates, status) is ever
  # returned, never Secret contents.
  helmHistory:
    enabled: false

  # ArgoCD sync history (read-only Application status/history/revision
  # metadata). The URL must be reachable FROM THE EXECUTOR POD — queries are
  # executed by the executor inside the monitored cluster (same outbound
  # channel as kubectl commands), never by the central API. Example:
  #   url: "https://argocd-server.argocd.svc.cluster.local"
  #
  # Leave url empty (default) to disable: the agent never queries ArgoCD and
  # the executor rejects ArgoCD requests with a clear "not configured" error.
  #
  # Split deployments (central API + remote executors): set the url on BOTH
  # installs. On an executor install it is what the executor dials; on the
  # API install it only switches the ArgoCD source on (never dialed there).
  argocd:
    url: ""
    # Secret in the release namespace holding a read-only ArgoCD API token
    # under the key "token". Create it manually:
    #   kubectl create secret generic kubently-argocd-token \
    #     --from-literal=token="<argocd-readonly-token>" --namespace kubently
    existingSecret: ""
    existingSecretKey: "token"

# ============================================================================
# Executor Configuration
# ============================================================================
# The executor runs IN the cluster being monitored and executes kubectl
# commands on behalf of AI agents. It connects back to the API server.
#
# Typical deployment pattern:
#   - API server: Central cluster (with Redis)
#   - Executor: Each monitored cluster (dev, staging, prod)
#
# Each executor needs:
#   1. A unique clusterId (identifies which cluster it monitors)
#   2. An authentication token (created via admin API)
#   3. The API server URL (where to send results)
# ============================================================================
executor:
  # Enable/disable executor deployment
  # Set to false if deploying only the API server (central cluster)
  # Set to true if deploying to a monitored cluster
  enabled: true

  # NOTE: Executors always run with 1 replica (no replicaCount setting)
  # Each executor represents a unique cluster identity (clusterId)
  # Running multiple replicas would create duplicate agents for the same cluster
  # For high availability, deploy the executor using a Deployment (default behavior)
  # which ensures automatic pod restart if it fails

  # ----------------------------------------------------------------------------
  # Container Configuration
  # ----------------------------------------------------------------------------
  image:
    repository: ghcr.io/kubently/kubently-executor
    tag: "latest"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # ----------------------------------------------------------------------------
  # Authentication & Cluster Identity
  # ----------------------------------------------------------------------------
  # These settings tell the executor WHICH cluster it's monitoring and
  # HOW to authenticate with the central API server

  # Cluster identifier (must be unique across all executors)
  # If empty, uses the Kubernetes namespace name as the cluster ID
  # Example: "prod-us-west", "staging-eu", "dev-local"
  clusterId: ""

  # Executor authentication token
  # This token is created via the admin API and stored in Redis
  # OPTION 1 (RECOMMENDED): Use existing secret (managed separately)
  existingSecret: ""  # e.g., "kubently-executor-token"
  existingSecretKey: "token"  # Key within the secret containing the token

  # OPTION 2: Provide token directly (NOT recommended for production)
  # Only used if existingSecret is not set
  # REQUIRED: You must provide a token value - deployment will fail if both are empty
  token: ""  # e.g., "my-secure-token-here" or set via --set executor.token=<value>

  # API server URL (where executor sends command results)
  # REQUIRED: You must explicitly set this based on your deployment topology
  #
  # Examples:
  #   Same cluster (executor + API in same cluster):
  #     apiUrl: "http://kubently-api:8080"
  #
  #   Cross-cluster with external domain (executor in remote cluster):
  #     apiUrl: "https://kubently-api.company.com"
  #
  #   Cross-cluster with internal load balancer:
  #     apiUrl: "http://kubently-api.central-cluster.svc.cluster.local:8080"
  apiUrl: ""

  # ServiceAccount annotations for the executor pod's cloud identity.
  # This is how you wire cloud IAM to the executor with NO code changes — kubectl
  # and cloud SDKs in the executor pick up credentials automatically:
  #   AWS IRSA:               eks.amazonaws.com/role-arn: arn:aws:iam::<acct>:role/<role>
  #   GKE Workload Identity:  iam.gke.io/gcp-service-account: <gsa>@<project>.iam.gserviceaccount.com
  # See docs/CLOUD_AUTH.md.
  serviceAccount:
    annotations: {}
    # Examples (uncomment ONE, matching your platform):
    #
    # AWS — IRSA (works on any EKS cluster with an OIDC provider):
    # annotations:
    #   eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/kubently-executor-readonly"
    #
    # AWS — EKS Pod Identity needs NO annotation; create a pod identity
    # association instead (see docs/CLOUD_TELEMETRY.md).
    #
    # GCP — GKE Workload Identity:
    # annotations:
    #   iam.gke.io/gcp-service-account: "kubently-executor@my-project.iam.gserviceaccount.com"

  # ----------------------------------------------------------------------------
  # Cloud Telemetry Access (workload identity, zero stored credentials)
  # ----------------------------------------------------------------------------
  # When enabled, the executor detects the cloud identity its pod holds (via
  # the ServiceAccount annotations above / EKS Pod Identity) and serves
  # READ-ONLY cloud telemetry queries: CloudWatch Logs/Metrics, EKS control
  # plane logs, CloudTrail on AWS; Cloud Logging, Cloud Monitoring, GKE audit
  # logs on GCP. Operations are whitelisted in code AND limited by the IAM
  # role YOU create and can revoke at any time. No keys are configured here,
  # uploaded anywhere, or stored by the control plane.
  #
  # Onboarding (exact IAM policy, Terraform + CLI): docs/CLOUD_TELEMETRY.md
  cloud:
    # Master switch — keep OFF unless you have granted a read-only role
    enabled: false

    # Which identity to look for: "auto" (try AWS, then GCP), "aws", or "gcp"
    provider: "auto"

    # Optional overrides (usually auto-detected from the pod environment)
    awsRegion: ""       # e.g. "us-west-2"
    gcpProject: ""      # e.g. "my-project"

    # How often (seconds) to re-detect identity + usable permissions,
    # so IAM changes (grants, revocations) are picked up without a restart
    refreshInterval: 3600

  # ----------------------------------------------------------------------------
  # Security & Command Whitelist
  # ----------------------------------------------------------------------------
  # Controls which kubectl commands the executor is allowed to run
  # This is a critical security boundary - AI agents request commands,
  # but the executor validates them before execution

  security:
    # Security mode determines the baseline set of allowed commands
    # Options:
    #   - readOnly: Safe read operations only (get, describe, logs)
    #   - extendedReadOnly: Includes debugging (port-forward, exec)
    #   - fullAccess: Advanced operations (use with extreme caution)
    mode: "readOnly"

    # Dynamic command whitelist (validates commands before execution)
    commandWhitelist:
      # Enable whitelist validation (disable for testing only)
      enabled: true

      # Add custom kubectl verbs beyond the mode defaults
      # Example: ["auth", "certificate", "cluster-info"]
      customVerbs: []

      # Add extra allowed flags beyond the mode defaults
      # Example: ["--raw", "--field-selector", "--chunk-size"]
      extraFlags: []

      # Add forbidden patterns beyond the immutable baseline
      # The baseline always blocks: delete, apply, create, tokens, shell injection
      # Example: ["rm", "sudo", "sh", "bash"]
      extraForbiddenPatterns: []

      # Restrict access to specific Kubernetes resources
      # Example: ["serviceaccounts", "roles", "rolebindings"]
      restrictedResources: []

      # Runtime limits for command execution
      maxArguments: 20        # Max number of arguments per command
      timeoutSeconds: 30      # Command execution timeout
      reloadInterval: 30      # How often to reload whitelist config (seconds)

  # ----------------------------------------------------------------------------
  # RBAC Configuration
  # ----------------------------------------------------------------------------
  # Defines what Kubernetes resources the executor ServiceAccount can access
  # If not specified, uses default rules with generic read access
  #
  # NOTE: This is separate from the command whitelist above:
  #   - rbacRules: What the ServiceAccount CAN access
  #   - commandWhitelist: What commands the AI agent CAN request
  rbacRules: []
  # Example custom rules:
  # rbacRules:
  # - apiGroups: [""]
  #   resources: ["pods", "services", "endpoints"]
  #   verbs: ["get", "list", "watch"]
  # - apiGroups: ["apps"]
  #   resources: ["deployments", "replicasets"]
  #   verbs: ["get", "list", "watch"]

  # ----------------------------------------------------------------------------
  # Capability Reporting (Optional)
  # ----------------------------------------------------------------------------
  # When enabled, executors advertise their command whitelist configuration
  # to the central API. This allows the agent to know what each cluster
  # can do before sending commands.
  #
  # This feature is completely optional - if disabled or if reporting fails,
  # the system continues to function normally (graceful degradation).
  capabilities:
    # Enable capability reporting to central API
    # Set to true to advertise what this executor can do
    enabled: false

    # Heartbeat interval (seconds) to refresh capability TTL
    # Capabilities expire after 1 hour by default; heartbeat keeps them alive
    heartbeatInterval: 300  # 5 minutes

  # ----------------------------------------------------------------------------
  # Environment Variables
  # ----------------------------------------------------------------------------
  env:
    LOG_LEVEL: "INFO"

# ============================================================================
# Emergency/Admin Override
# ============================================================================
# CRITICAL SAFETY FLAG: Must be explicitly set to true to enable fullAccess mode
# This prevents accidental deployment of executors with dangerous permissions
#
# fullAccess mode allows commands like: exec, cp, run, attach, proxy
# Only enable this if you understand the security implications
fullAccessAcknowledged: false

# Redis Configuration
redis:
  enabled: true
  auth:
    enabled: true  # CRITICAL: Enable authentication for production

    # Reference to manually created secret containing Redis password
    # The secret must have a 'password' key
    # Default expects: kubently-redis-password
    # Create with:
    #   kubectl create secret generic kubently-redis-password \
    #     --from-literal=password="$(openssl rand -base64 32)" -n kubently
    # Or specify a different secret name:
    #   existingSecret: "my-custom-redis-secret"
    existingSecret: "kubently-redis-password"

  architecture: standalone
  master:
    persistence:
      enabled: true  # Uses StatefulSet volumeClaimTemplates for persistent storage
      size: 2Gi      # PersistentVolume size - stores executor tokens, sessions, cluster state
      storageClass: ""  # Uses cluster default StorageClass if empty
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

# Ingress Configuration
# This chart follows the "user brings certificate" pattern (Bitnami/ArgoCD standard)
# TLS certificates must be created separately and referenced via secretName
# See examples/ directory for TLS setup patterns
ingress:
  enabled: false
  className: nginx

  # Annotations are passed through directly
  # For cert-manager integration, add cert-manager.io/cluster-issuer annotation
  # For other ingress controllers, add appropriate annotations
  annotations: {}
  # Examples:
  # cert-manager.io/cluster-issuer: "letsencrypt-prod"
  # nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  # nginx.ingress.kubernetes.io/proxy-read-timeout: "60"

  hosts:
    - host: api.kubently.local
      paths:
        - path: /
          pathType: Prefix

  # TLS certificates (must be created separately)
  # See examples/ directory for different TLS patterns
  tls: []
  # Example:
  # tls:
  #   - secretName: kubently-api-tls  # You must create this secret
  #     hosts:
  #       - api.kubently.com

# Autoscaling Configuration
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Service Account
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use
  name: ""

# Pod Security Context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# Security Context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# Node Selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Network Policy
networkPolicy:
  enabled: false
  
# Pod Disruption Budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1