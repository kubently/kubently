{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubently.fullname" . }}-api
  labels:
    {{- include "kubently.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "kubently.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/api-configmap.yaml") . | sha256sum }}
      labels:
        {{- include "kubently.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kubently.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
      - name: sync-executor-tokens
        image: redis:7-alpine
        command:
        - sh
        - -c
        - |
          echo "Syncing executor tokens to Redis..."

          # Wait for Redis to be ready with timeout
          timeout=60
          retries=$((timeout / 2))
          count=0
          {{- if .Values.redis.auth.enabled }}
          until redis-cli -h ${REDIS_HOST} -p ${REDIS_PORT} -a ${REDIS_PASSWORD} ping | grep -q PONG; do
            count=$((count + 1))
            if [ $count -gt $retries ]; then
              echo "Error: Timed out waiting for Redis after ${timeout}s"
              exit 1
            fi
            echo "Waiting for Redis... (attempt $count/$retries)"
            sleep 2
          done
          {{- else }}
          until redis-cli -h ${REDIS_HOST} -p ${REDIS_PORT} ping | grep -q PONG; do
            count=$((count + 1))
            if [ $count -gt $retries ]; then
              echo "Error: Timed out waiting for Redis after ${timeout}s"
              exit 1
            fi
            echo "Waiting for Redis... (attempt $count/$retries)"
            sleep 2
          done
          {{- end }}

          # Sync executor tokens from secrets to Redis
          {{- if .Values.executor.enabled }}
          EXECUTOR_TOKEN="${EXECUTOR_TOKEN}"
          CLUSTER_ID="${CLUSTER_ID}"
          if [ -n "$EXECUTOR_TOKEN" ] && [ -n "$CLUSTER_ID" ]; then
            echo "Registering executor token for cluster: ${CLUSTER_ID}"
            {{- if .Values.redis.auth.enabled }}
            redis-cli -h ${REDIS_HOST} -p ${REDIS_PORT} -a ${REDIS_PASSWORD} SET "executor:token:${CLUSTER_ID}" "${EXECUTOR_TOKEN}"
            {{- else }}
            redis-cli -h ${REDIS_HOST} -p ${REDIS_PORT} SET "executor:token:${CLUSTER_ID}" "${EXECUTOR_TOKEN}"
            {{- end }}
            echo "✓ Token registered for ${CLUSTER_ID}"
          fi
          {{- end }}

          echo "Token sync complete"
        env:
        - name: REDIS_HOST
          value: {{ .Release.Name }}-redis-master
        - name: REDIS_PORT
          value: "6379"
        {{- if .Values.redis.auth.enabled }}
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              {{- if .Values.redis.auth.existingSecret }}
              name: {{ .Values.redis.auth.existingSecret }}
              {{- else }}
              name: kubently-redis-password
              {{- end }}
              key: password
        {{- end }}
        {{- if .Values.executor.enabled }}
        - name: EXECUTOR_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "kubently.fullname" . }}-executor-token
              key: token
        - name: CLUSTER_ID
          value: {{ .Values.executor.clusterId | default .Release.Namespace }}
        {{- end }}
      containers:
      - name: api
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.api.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name  # Pod name for routing
        - name: REDIS_URL
          value: {{ include "kubently.redisUrl" . }}
        - name: REDIS_HOST
          value: {{ .Release.Name }}-redis-master
        - name: REDIS_PORT
          value: "6379"
        - name: REDIS_DB
          value: "0"
        {{- if .Values.redis.auth.enabled }}
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              {{- if .Values.redis.auth.existingSecret }}
              name: {{ .Values.redis.auth.existingSecret }}
              {{- else }}
              name: kubently-redis-password
              {{- end }}
              key: password
        {{- end }}
        - name: API_KEYS
          valueFrom:
            secretKeyRef:
              name: {{ .Values.api.existingSecret | default (printf "%s-api-keys" (include "kubently.fullname" .)) }}
              key: keys
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: kubently-llm-secrets
              key: GOOGLE_API_KEY
              optional: true
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: kubently-llm-secrets
              key: OPENAI_API_KEY
              optional: true
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: kubently-llm-secrets
              key: ANTHROPIC_API_KEY
              optional: true
        - name: LANGSMITH_API_KEY
          valueFrom:
            secretKeyRef:
              name: kubently-llm-secrets
              key: LANGSMITH_API_KEY
              optional: true
        {{- range $key, $value := .Values.api.env }}
        {{- if ne $key "SLACK_WEBHOOK_URL" }}
        - name: {{ $key }}
          value: {{ $value | quote }}
        {{- end }}
        {{- end }}
        {{- /* A webhook URL is a credential: prefer a secret, and never let a
               values-file copy silently win over one. */}}
        {{- if .Values.api.slackWebhook.existingSecret }}
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.api.slackWebhook.existingSecret }}
              key: {{ .Values.api.slackWebhook.secretKey }}
        {{- else if .Values.api.env.SLACK_WEBHOOK_URL }}
        - name: SLACK_WEBHOOK_URL
          value: {{ .Values.api.env.SLACK_WEBHOOK_URL | quote }}
        {{- end }}
        {{- /* Presence of LOKI_URL switches on the agent's query_loki tool +
               prompt guidance. The API never dials this URL itself — queries
               run on each cluster's executor. Parenthesized lookup is
               nil-safe for old values files. */}}
        {{- if (.Values.loki).url }}
        - name: LOKI_URL
          value: {{ .Values.loki.url | quote }}
        {{- end }}
        {{- /* Presence of PROMETHEUS_URL switches on the agent's
               query_prometheus tool + prompt guidance. The API never dials
               this URL itself — queries run on each cluster's executor. */}}
        {{- if (.Values.prometheus).url }}
        - name: PROMETHEUS_URL
          value: {{ .Values.prometheus.url | quote }}
        {{- end }}
        {{- /* Presence of ARGOCD_URL switches on the ArgoCD source of the
               agent's get_recent_changes tool. The API never dials this URL
               itself — queries run on each cluster's executor. */}}
        {{- if ((.Values.changeCorrelation).argocd).url }}
        - name: ARGOCD_URL
          value: {{ .Values.changeCorrelation.argocd.url | quote }}
        {{- end }}
        {{- /* GitOps PR remediation (default OFF). Registers the agent's
               get_manifest_file + propose_fix_pr tools. Runs on the API
               server only — executors never hold the Git token. The token
               comes from a manually created, repo-scoped secret and never
               enters model context. Parenthesized lookup is nil-safe for
               old values files. */}}
        {{- if (.Values.gitRemediation).enabled }}
        - name: KUBENTLY_GITOPS_PROVIDER
          value: {{ .Values.gitRemediation.provider | quote }}
        - name: KUBENTLY_GITOPS_REPO
          value: {{ required "gitRemediation.repo is required when gitRemediation.enabled" .Values.gitRemediation.repo | quote }}
        - name: KUBENTLY_GITOPS_BASE_BRANCH
          value: {{ .Values.gitRemediation.baseBranch | default "main" | quote }}
        - name: KUBENTLY_GITOPS_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ required "gitRemediation.existingSecret is required when gitRemediation.enabled" .Values.gitRemediation.existingSecret }}
              key: {{ .Values.gitRemediation.existingSecretKey | default "token" }}
        {{- if .Values.gitRemediation.maxFiles }}
        - name: KUBENTLY_GITOPS_MAX_FILES
          value: {{ .Values.gitRemediation.maxFiles | quote }}
        {{- end }}
        {{- if .Values.gitRemediation.maxLines }}
        - name: KUBENTLY_GITOPS_MAX_LINES
          value: {{ .Values.gitRemediation.maxLines | quote }}
        {{- end }}
        {{- if .Values.gitRemediation.apiBase }}
        - name: KUBENTLY_GITOPS_API_BASE
          value: {{ .Values.gitRemediation.apiBase | quote }}
        {{- end }}
        {{- end }}
        {{- /* External MCP servers: presence switches on the agent's
               mcp_<server>_* tools + prompt guidance. Bearer tokens stay in
               secrets — the JSON only names the env var that carries each
               one (bearer_token_env), filled from secretKeyRef below. */}}
        {{- if .Values.mcpServers }}
        - name: KUBENTLY_MCP_SERVERS
          value: {{ include "kubently.mcpServersJson" . | quote }}
        {{- range .Values.mcpServers }}
        {{- if .existingSecret }}
        - name: {{ include "kubently.mcpTokenEnvName" .name }}
          valueFrom:
            secretKeyRef:
              name: {{ .existingSecret }}
              key: {{ .secretKey | default "token" }}
        {{- end }}
        {{- end }}
        {{- end }}
        - name: KUBENTLY_A2A_PROMPT_FILE
          value: "/etc/kubently/prompts/system.prompt.yaml"
        - name: KUBENTLY_FLEET_REPORT_PROMPT_FILE
          value: "/etc/kubently/prompts/fleet_report.prompt.yaml"
        {{- if .Values.runbooks }}
        - name: KUBENTLY_RUNBOOKS_DIR
          value: "/etc/kubently/runbooks"
        {{- end }}
        {{- if .Values.scheduledChecks.enabled }}
        - name: KUBENTLY_CHECKS_FILE
          value: "/etc/kubently/checks/checks.yaml"
        {{- end }}
        {{- /* Deploy watch: sweep for kubently.io/verify=enabled workloads and
               verify on generation change. 0/absent disables the watch. */}}
        {{- if ((.Values.verifyDeployment).watch).enabled }}
        - name: KUBENTLY_VERIFY_WATCH_SECONDS
          value: {{ .Values.verifyDeployment.watch.intervalSeconds | default 60 | quote }}
        {{- with .Values.verifyDeployment.watch.clusters }}
        - name: KUBENTLY_VERIFY_WATCH_CLUSTERS
          value: {{ join "," . | quote }}
        {{- end }}
        {{- end }}
        {{- if (.Values.verifyDeployment).timeoutSeconds }}
        - name: KUBENTLY_VERIFY_TIMEOUT_SECONDS
          value: {{ .Values.verifyDeployment.timeoutSeconds | quote }}
        {{- end }}
        volumeMounts:
        - name: prompt-config
          mountPath: /etc/kubently/prompts
          readOnly: true
        {{- if .Values.runbooks }}
        - name: runbooks
          mountPath: /etc/kubently/runbooks
        {{- end }}
        {{- if .Values.scheduledChecks.enabled }}
        - name: checks-config
          mountPath: /etc/kubently/checks
          readOnly: true
        {{- end }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          {{- toYaml .Values.api.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: prompt-config
        configMap:
          name: {{ include "kubently.fullname" . }}-prompt
      {{- if .Values.runbooks }}
      - name: runbooks
        configMap:
          name: {{ include "kubently.fullname" . }}-runbooks
      {{- end }}
      {{- if .Values.scheduledChecks.enabled }}
      - name: checks-config
        configMap:
          name: {{ include "kubently.fullname" . }}-checks
      {{- end }}
{{- end }}